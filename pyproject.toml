[project]
name = "tracktool"
version = "1.0.0"
description = "Travel media geodata toolkit: KML track management and photo/video EXIF geotagging"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "lxml>=5.0",
    "requests>=2.31",
    "geopy>=2.5.0",
]

[project.scripts]
tracktool = "tracktool.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracktool"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

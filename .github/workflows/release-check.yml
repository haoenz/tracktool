name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
          run_install: false
      - name: Install external tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg perl zsh
      - name: Install external tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install external tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm cli setup chromium --with-deps
      - run: pnpm test:e2e
      - name: Native terminal checks
        if: runner.os == 'Linux'
        run: pnpm test:terminal sandbox/release-check
      - run: pnpm pack --pack-destination sandbox/pack
      - name: Prepare isolated consumer
        run: node scripts/release/prepare-consumer.mjs sandbox/consumer sandbox/pack
      - run: pnpm --dir sandbox/consumer install --frozen-lockfile=false
      - run: pnpm verify:package sandbox/consumer sandbox/release-check
      - name: Web restart checks without Python (Linux)
        if: runner.os == 'Linux'
        run: node scripts/release/web-smoke.mjs sandbox/consumer sandbox/release-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-check-${{ matrix.os }}
          path: |
            sandbox/release-check
            sandbox/pack
            test-results
            playwright-report
